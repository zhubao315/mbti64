name: Pages Build Check

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Data audit
        run: npm run audit:personality

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build pages
        env:
          NEXT_PUBLIC_BASE_PATH: /mbti64
          NEXT_PUBLIC_SITE_URL: https://zhubao315.github.io
        run: npm run build:pages

      # 防呆门禁：子路径部署下，任何根路径资源引用都会导致线上 404
      - name: Assert basePath in all HTML
        run: node scripts/check-basepath.mjs

      - name: Assert output size < 80MB
        run: |
          SIZE=$(du -sb out | cut -f1)
          echo "out size: $SIZE bytes"
          if [ "$SIZE" -gt 83886080 ]; then echo "ERROR: out/ exceeds 80MB"; exit 1; fi

      - name: Assert key pages exist
        run: |
          test -f out/index.html
          test -f "out/type/INFJ-A-O/index.html"
          test -f out/result/index.html
          echo "key pages OK"

      # 产物留档，方便比对包体与排查 basePath 问题
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages-out
          path: out
          retention-days: 7
